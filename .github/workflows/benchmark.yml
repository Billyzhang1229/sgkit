name: Benchmarks

on:
  push:
    branches:
      - main

env:
  BENCHMARKS_REPO: sgkit-dev/sgkit-benchmarks-asv
  ASV_CONFIG: benchmarks/asv.conf.json
  MACHINE_NAME: github-actions  # to identify github actions machine as hostname changes everytime

jobs:
  build:
    # This workflow only runs on the origin org
    if: github.repository_owner == 'sgkit-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # To fetch all commits to be able to generate benchmarks html
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt update -y
          python -m pip install --upgrade pip
          pip install asv==0.6.6

      - name: Set and log asv machine configuration
        run: |
          asv machine --yes --config benchmarks/asv.conf.json
          echo "Machine Configuration:"
          cat ~/.asv-machine.json
          rm ~/.asv-machine.json

          echo "Setting machine name to $MACHINE_NAME"
          asv machine --machine "$MACHINE_NAME" --yes --config "$ASV_CONFIG" -v

      - name: Run benchmarks
        run: |
          asv run --config "$ASV_CONFIG" -v

      - name: Checkout benchmark results
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BENCHMARKS_REPO }}
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: benchmark-site

      - name: Publish benchmarks with historical results
        run: |
          RESULTS_DIR="benchmark-site/results/$MACHINE_NAME"
          if [ -d "$RESULTS_DIR" ]
          then
            # Preserve the current run's results and machine configuration.
            rsync -r --ignore-existing "$RESULTS_DIR/" "benchmarks/results/$MACHINE_NAME/"
          else
            echo "No historical results for $MACHINE_NAME"
          fi
          asv update --config "$ASV_CONFIG"
          asv publish --config "$ASV_CONFIG" -v
          cp -r benchmarks/html/. benchmark-site/
          cp -r benchmarks/results benchmark-site/

      - name: Push benchmarks
        working-directory: benchmark-site
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No benchmark changes to publish"
            exit 0
          fi
          git config user.email "project@sgkit.dev"
          git config user.name "sgkit benchmark bot"
          git commit -m "Update benchmarks"
          git push origin main
